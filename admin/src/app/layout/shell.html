<header class="topbar">
  <div class="brand">
    <span class="mark">A</span>
    <div class="titles">
      <strong>AATAMGT Admin</strong>
      <span>Operations console</span>
    </div>
  </div>

  <nav>
    <a routerLink="/dashboard" class="nav-link">Dashboard</a>
    <a routerLink="/users" class="nav-link">Users</a>
    @if (auth.user?.role === 'ADMIN') {
      <a routerLink="/audit" class="nav-link">Audit</a>
    }
  </nav>

  <div class="session">
    <div class="who">
      <span class="username">{{ auth.user?.username }}</span>
      <span class="role" [class.admin]="auth.user?.role === 'ADMIN'">
        {{ auth.user?.role }}
      </span>
    </div>
    <button class="logout" (click)="logout()">Sign out</button>
  </div>
</header>

<main class="content">
  <router-outlet />
</main>
